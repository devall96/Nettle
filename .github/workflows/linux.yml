# Builds the Linux AppImage (with libmpv bundled), proves it works on clean machines of several
# distros, and optionally attaches it to the GitHub release for the current version.
name: Linux AppImage

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the AppImage to the existing GitHub release v<Version>"
        type: boolean
        default: false
      replace:
        description: "Replace this version's Linux files in place (a fix before anyone could update; no delta package)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    # Oldest supported base: the AppImage runs on this glibc (2.39) and anything newer.
    # (Ubuntu 24.04 is the oldest Ubuntu with a recent enough mpv / libplacebo.)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: ver
        run: echo "version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Install libmpv (to bundle) and FFmpeg (to make test clips)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 ffmpeg

      - name: Publish
        run: dotnet publish src/Nettle.Desktop -c Release -r linux-x64 --self-contained -p:DebugType=none -o publish

      - name: Bundle libmpv
        run: bash .github/linux/bundle-libmpv.sh publish/mpv

      - name: Make test clips
        run: |
          mkdir -p testmedia
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=24 -f lavfi -i sine=frequency=440 -t 4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac testmedia/h264-aac.mp4
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=3840x2160:rate=24 -f lavfi -i sine=frequency=330 -t 3 \
            -c:v libx265 -pix_fmt yuv420p10le -x265-params log-level=error -c:a eac3 testmedia/hevc10-eac3.mkv
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=550 -t 3 \
            -c:v libaom-av1 -cpu-used 8 -row-mt 1 -c:a libopus testmedia/av1-opus.mkv

      - name: Previous Linux release (for delta updates)
        if: ${{ inputs.publish && !inputs.replace }}
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel linux -o releases || echo "no previous Linux release"

      # packId stays SlopfinApp (the app's name before 0.3.0): installed copies find their updates by it.
      # The AppImage people download is renamed to Nettle.AppImage; the updater only uses the .nupkg / .json files.
      - name: Pack AppImage
        run: |
          dotnet tool restore
          dotnet vpk pack --packId SlopfinApp --packVersion "${{ steps.ver.outputs.version }}" --packDir publish \
            --mainExe Nettle --packTitle Nettle --packAuthors "Nettle contributors" \
            --icon src/Nettle.Desktop/Assets/nettle.png --categories "AudioVideo;Video;Player;TV" -o releases
          mv releases/SlopfinApp.AppImage releases/Nettle.AppImage
          ls -la releases

      - uses: actions/upload-artifact@v4
        with:
          name: releases-linux
          path: releases/

      - uses: actions/upload-artifact@v4
        with:
          name: testmedia
          path: testmedia/

  # Ubuntu 24.04 desktop-like runner: decode test, menu entry test and a real screenshot of the UI.
  test-ubuntu:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick desktop-file-utils
      - name: Extract AppImage
        run: |
          chmod +x releases-linux/*.AppImage
          releases-linux/*.AppImage --appimage-extract > /dev/null
          echo "NETTLE=$(find "$PWD/squashfs-root" -name Nettle -type f -perm -u+x | head -n1)" >> "$GITHUB_ENV"
          du -sh squashfs-root; ls -la releases-linux
      - name: mpv is not installed on this machine
        run: "! ldconfig -p | grep -q libmpv"
      - name: Decode test (bundled libmpv)
        run: |
          "$NETTLE" --selftest testmedia/*
          grep "libmpv" ~/.local/share/Nettle/nettle.log || true
      - name: Applications menu entry
        run: |
          export APPIMAGE="$PWD/My Apps/Nettle.AppImage"
          "$NETTLE" --add-to-menu
          cat ~/.local/share/applications/nettle.desktop
          desktop-file-validate ~/.local/share/applications/nettle.desktop
          test -s ~/.local/share/icons/hicolor/256x256/apps/nettle.png
          "$NETTLE" --remove-from-menu
          test ! -e ~/.local/share/applications/nettle.desktop
      - name: UI screenshot
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            "$NETTLE" & pid=$!
            sleep 15
            import -window root screenshot.png
            kill $pid || true'
          grep -iE "error|exception" ~/.local/share/Nettle/nettle.log || echo "no errors in log"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-ubuntu
          path: screenshot.png

  # Clean containers of other distros with only typical desktop libraries installed (no mpv, no FFmpeg).
  test-distros:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            setup: dnf install -y libicu glib2 libX11 libxcb mesa-libGL mesa-libEGL alsa-lib pulseaudio-libs fontconfig freetype findutils
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm icu glib2 libx11 libxcb mesa alsa-lib libpulse fontconfig freetype2 findutils
          - image: debian:13
            setup: apt-get update && apt-get install -y --no-install-recommends libicu76 libglib2.0-0t64 libx11-6 libxcb1 libgl1 libegl1 libasound2t64 libpulse0 fontconfig libfreetype6
    container: ${{ matrix.image }}
    steps:
      - name: Desktop baseline
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
      - name: Decode test (bundled libmpv)
        run: |
          chmod +x releases-linux/*.AppImage
          releases-linux/*.AppImage --appimage-extract > /dev/null
          NETTLE="$(find "$PWD/squashfs-root" -name Nettle -type f -perm -u+x | head -n1)"
          "$NETTLE" --selftest testmedia/*
          grep "libmpv" ~/.local/share/Nettle/nettle.log || true

  publish:
    needs: [build, test-ubuntu, test-distros]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: releases-linux
          path: releases
      - name: Attach to release v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Older versions' packages were only downloaded to build the delta; they already live on
        # their own releases, so only this version's files are attached. assets.*.json is vpk's own
        # upload checklist (the app's updater never reads it), so it stays off the release page.
        run: |
          find releases -name '*.nupkg' ! -name "*-${{ needs.build.outputs.version }}-*" -print -delete
          rm -f releases/assets.*.json
          gh release upload "v${{ needs.build.outputs.version }}" releases/* --clobber --repo "${{ github.repository }}"
