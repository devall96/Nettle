# Every push to main and every pull request: build Nettle for Windows and Linux and run the
# tests (including the "never transcode" guard). Releases are still built separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Get libmpv (pinned, checksum-verified)
        shell: pwsh
        run: ./get-libmpv.ps1
      - name: Build
        run: dotnet build src/Nettle.Desktop -c Release -r win-x64
      - name: Unit tests
        run: dotnet test tests/Nettle.Tests -c Release --logger "console;verbosity=normal"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install libmpv and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 ffmpeg
      - name: Build
        run: dotnet build src/Nettle.Desktop -c Release -r linux-x64 -o out
      - name: Unit tests
        run: dotnet test tests/Nettle.Tests -c Release --logger "console;verbosity=normal"
      - name: Playback self-test (decodes a clip with libmpv, no window)
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440 -t 3 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          ./out/Nettle --selftest clip.mp4
